name: Publish to nuget

on:
  release:
    types: [created, edited]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Enable GitHub OIDC token issuance for this job.

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: dotnet pack
        # PathMap=$PWD=/_ works around the F# compiler writing "/_//src/..." into the PDB
        # with the SDK's default "<repo>/=/_/" mapping. Without it the PDB paths don't match
        # the "/_/src/..." paths in the F# metadata, and Ionide's go to definition fails.
        run: |
          dotnet pack --configuration Release --warnaserror --output out/Release -p:ContinuousIntegrationBuild=true -p:EmbedAllSources=true -p:DeterministicSourcePaths=true -p:PathMap=$PWD=/_ -p:PackageVersion=${GITHUB_REF/refs\/tags\/v/''}

      - uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: dotnet nuget push
        run: dotnet nuget push out/Release/*.nupkg --skip-duplicate --api-key ${{steps.login.outputs.NUGET_API_KEY}} --source https://api.nuget.org/v3/index.json
